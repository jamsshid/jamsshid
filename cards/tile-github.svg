<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="108" viewBox="0 0 320 108">
    <style>text{font-family:"Plus Jakarta Sans",Arial,sans-serif}.mono{font-family:"JetBrains Mono",monospace}
      @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      .enter{opacity:0;animation:rise .8s cubic-bezier(.2,.75,.2,1) 0.55s both}
      @keyframes reveal{to{stroke-dashoffset:0}}
      .line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:reveal 1.5s ease 0.90s forwards}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.smil{display:none!important}}
    </style><a xlink:href="https://github.com/jamsshid" target="_blank"><g class="enter"><rect x="1" y="1" width="318" height="106" rx="16" fill="#161B22" stroke="#30363D"/><rect x="17" y="21" width="42" height="42" rx="12" fill="#172B45"/><text x="38" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#58A6FF">GH</text><text x="76" y="39" class="mono" font-size="11" fill="#58A6FF">GITHUB</text><text x="76" y="63" font-size="13" fill="#E6EDF3">github.com/jamsshid</text></g></a></svg>
