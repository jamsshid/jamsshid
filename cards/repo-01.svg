<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="152" viewBox="0 0 1000 152">
    <style>text{font-family:"Plus Jakarta Sans",Arial,sans-serif}.mono{font-family:"JetBrains Mono",monospace}
      @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      .enter{opacity:0;animation:rise .8s cubic-bezier(.2,.75,.2,1) 1.65s both}
      @keyframes reveal{to{stroke-dashoffset:0}}
      .line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:reveal 1.5s ease 2.00s forwards}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.smil{display:none!important}}
    </style><rect x="1" y="1" width="998" height="150" rx="20" fill="#0D1117" stroke="#30363D"/><a xlink:href="https://github.com/jamsshid/ecommerce_api" target="_blank"><g class="enter"><rect x="26" y="26" width="52" height="52" rx="14" fill="#172B45"/><text x="52" y="61" text-anchor="middle" font-size="23" font-weight="700" fill="#58A6FF">&lt;/&gt;</text><text x="104" y="48" font-size="21" font-weight="700" fill="#E6EDF3">E-Commerce API</text><text x="104" y="78" font-size="14" fill="#8B949E">REST API with JWT authentication, Stripe checkout and webhooks.</text><text x="104" y="116" class="mono" font-size="11" fill="#58A6FF">Django · DRF · PostgreSQL · Stripe · Docker</text><text x="952" y="51" text-anchor="end" font-size="12" fill="#58A6FF">OPEN REPOSITORY ↗</text></g></a></svg>
