<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="108" viewBox="0 0 320 108">
    <style>text{font-family:"Plus Jakarta Sans",Arial,sans-serif}.mono{font-family:"JetBrains Mono",monospace}
      @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      .enter{opacity:0;animation:rise .8s cubic-bezier(.2,.75,.2,1) 0.73s both}
      @keyframes reveal{to{stroke-dashoffset:0}}
      .line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:reveal 1.5s ease 1.08s forwards}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.smil{display:none!important}}
